<main class="home">
  <section class="home__hero">
    <div class="home__hero--content">
      <h1 class="home__hero--title">Collect Feedback, Unlock Ideas</h1>
      <p class="home__hero--text">
        Create and share surveys in minutes – from team events to workplace culture.
        Collect opinions, engage your audience, and turn feedback into action.
      </p>
      <button class="btn btn__new-survey" type="button" (click)="openCreateSurvey()">
        <span class="btn__new-survey--text">New survey</span>
        <span class="btn__icon" aria-hidden="true">
          <img class="btn__new-survey--circle" aria-hidden="true" src="/assets/icons/add_circle.svg" alt="">
        </span>
      </button>
    </div>
    <div class="home__hero--visual">
      <img class="home__visual--image" src="/assets/visual/visual.svg" alt="">
      <img class="home__visual--hover" src="/assets/visual/visual__hover.svg" alt="">
    </div>
  </section>

  <section class="home__surveys">
    <h2 class="home__surveys--title">Your surveys</h2>
    <app-ending-surveys />
    <app-survey-list />
  </section>

  @if (isCreateOpen()) {
  <app-create-survey (closed)="closeCreateSurvey()" (created)="reloadSurveys()" />
  }
</main>
