<main class="home">
  <section class="home__hero">
    <div class="home__hero--content">
      <h1 class="home__hero--title">Collect Feedback, Unlock Ideas</h1>
      <p class="home__hero--text">
        Create and share surveys in minutes – from team events to workplace culture.
        Collect opinions, engage your audience, and turn feedback into action.
      </p>
      <button class="home__hero--button" type="button" (click)="goToCreateSurvey()">
        <picture>
          <source media="(max-width: 768px)" srcset="/assets/buttons/button__primary--new-survey-+.svg">
          <img class="button__new-survey" src="/assets/buttons/button__primary--new-survey.svg"
            alt="New survey">
        </picture>
      </button>
    </div>
    <img class="home__hero--image" src="/assets/position 03@2x 1.svg" alt="">
  </section>

  <section class="home__surveys">
    <h2 class="home__surveys--title">Your surveys</h2>
  </section>
</main>
