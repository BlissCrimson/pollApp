<section class="surveys">
  @if (errorMessage()) {
    <p class="surveys__message">{{ errorMessage() }}</p>
  } @else if (surveys().length === 0) {
    <p class="surveys__message">No surveys yet.</p>
  } @else {
    <ul class="surveys__list">
      @for (survey of surveys(); track survey.id) {
        <li class="surveys__card">
          <span class="surveys__category">{{ survey.category }}</span>
          <h3 class="surveys__title">{{ survey.title }}</h3>
          @if (getEndLabel(survey.endDate)) {
            <span class="surveys__badge">{{ getEndLabel(survey.endDate) }}</span>
          }
        </li>
      }
    </ul>
  }
</section>
