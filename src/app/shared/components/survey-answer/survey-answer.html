<div class="answer">
  <label class="answer__area--input">
    <input
      class="answer__input"
      [type]="allowMultiple() ? 'checkbox' : 'radio'"
      [name]="name()"
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="selected.emit(answer().id)"
    />
    <span class="answer__text">{{ answer().text }}</span>
  </label>
</div>
