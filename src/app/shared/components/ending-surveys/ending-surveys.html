@if (surveys().length > 0) {
  <section class="ending-surveys">
    <h3 class="ending-surveys__title">Ending soon surveys</h3>
    <ul class="ending-surveys__list">
      @for (survey of surveys(); track survey.id) {
        <li class="ending-surveys__item">
          <app-survey-card [survey]="survey" variant="light" />
        </li>
      }
    </ul>
  </section>
}
