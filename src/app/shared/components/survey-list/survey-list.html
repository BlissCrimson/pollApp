<section class="survey-list">
  <div class="survey-list__toolbar">
    <div class="survey-list__filters">
      <button class="survey-list__filter" [class.survey-list__filter--active]="activeFilter() === 'active'"
        type="button" [attr.aria-pressed]="activeFilter() === 'active'" (click)="setFilter('active')">
        Active survey
      </button>
      <button class="survey-list__filter" [class.survey-list__filter--active]="activeFilter() === 'past'"
        type="button" [attr.aria-pressed]="activeFilter() === 'past'" (click)="setFilter('past')">
        Past survey
      </button>
    </div>
    <select class="survey-list__select" aria-label="Filter by category" (change)="setCategory($event)">
      <option value="" selected>All surveys</option>
      @for (category of categories; track category.value) {
        <option [value]="category.value">{{ category.label }}</option>
      }
    </select>
  </div>

  @if (errorMessage()) {
    <p class="survey-list__message">{{ errorMessage() }}</p>
  } @else if (filteredSurveys().length === 0) {
    <p class="survey-list__message">No surveys yet.</p>
  } @else {
    <ul class="survey-list__list">
      @for (survey of filteredSurveys(); track survey.id) {
        <li class="survey-list__item">
          <app-survey-card [survey]="survey" variant="dark" />
        </li>
      }
    </ul>
  }
</section>
